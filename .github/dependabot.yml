version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      frontend-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The current vue-tsc and typescript-eslint toolchain does not support
      # TypeScript 7. Keep receiving patch/minor updates on the supported line.
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      container-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
