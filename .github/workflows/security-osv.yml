name: Security - OSV Scanner

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  merge_group:
    branches: ["master"]
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-osv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan target branch
        continue-on-error: true
        run: git checkout "$GITHUB_BASE_REF"
      - name: Capture target dependency findings
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output-file=old-results.json
            --recursive
            ./

      - name: Restore proposed change
        run: git checkout --force "$GITHUB_SHA"
      - name: Capture proposed dependency findings
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output-file=new-results.json
            --recursive
            ./

      - name: Block newly introduced vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.3.8
        with:
          scan-args: |-
            --output-files=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-pr-results
          path: |
            results.sarif
            old-results.json
            new-results.json
          retention-days: 14

      - name: Publish results to code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif

  scan-full:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Keep this job local so repository SHA-pinning applies to every action.
      # The upstream reusable workflow currently contains an unpinned
      # actions/download-artifact reference, even when no artifact is requested.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Capture dependency findings
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output=results.json
            --recursive
            ./

      - name: Generate full-scan SARIF
        uses: google/osv-scanner-action/osv-reporter-action@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.3.8
        with:
          scan-args: |-
            --output-files=results.sarif
            --new=results.json
            --gh-annotations=true
            --fail-on-vuln=false

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-full-results
          path: |
            results.json
            results.sarif
          retention-days: 14

      - name: Publish results to code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
